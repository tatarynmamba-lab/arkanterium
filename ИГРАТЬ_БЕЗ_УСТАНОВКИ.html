 service(type,n=''){this.idle();const s=this.s;if(type==='copy'){this.need(s.tier===6,'Нужен Хранитель Зеркал.');this.need(this.count(n)&&D.items[n].slot,'Выберите предмет экипировки.');this.remove('Осколок зеркала',100);this.add(n);this.say('Создана копия: '+n);}else if(type==='appearance'){this.need(s.tier===6,'Нужен Хранитель Зеркал.');this.remove('Осколок зеркала',20);s.flags.appearance=((s.flags.appearance||0)+1)%3;this.say('Хранитель изменил облик героя.');}else if(type==='respec'){this.need(s.tier===7,'Нужен Аватар Бездны.');this.remove('Слеза Бездны',20);s.skillPoints+=Object.values(s.skills).reduce((a,b)=>a+b,0);s.skills={};s.loadout=[];this.say('Очки умений возвращены.');}else if(type==='upgrade10'){this.need(s.tier===7,'Нужен Аватар Бездны.');this.need(this.count(n)&&['weapon','armor'].includes(D.items[n].slot),'Выберите оружие или броню.');this.remove('Слеза Бездны',100);s.upgrades[n]=10;this.say('Улучшено до +10: '+n);}else if(type==='tail'){this.need(s.tier===2,'Нужен Борин.');this.remove('Крысиный хвост',5);this.add('Малое зелье HP');}else if(type==='bone'){this.need(s.tier===5,'Нужен Ваэлор.');this.remove('Кость',20);this.add('Эликсир очищения');}this.cap();}
 wait(){this.idle();this.tick();this.say('Прошёл час. День '+this.s.day+', '+this.s.hour+':00.');}
 convert(rarity){this.idle();const rules={0:[100,2,5],1:[10,2,4],2:[5,3,3],3:[3,4,6]},rule=rules[rarity];this.need(rule&&this.s.tier>=rule[2],'Обмен пока недоступен.');const pool=Object.keys(this.s.inventory).filter(n=>D.items[n]?.rarity===rarity&&!Object.values(this.s.equipment).includes(n)&&!(/ключ|дыхание|книга тар-морана|осколок изнанки/i.test(n)));this.need(pool.reduce((a,n)=>a+this.count(n),0)>=rule[0],'Не хватает предметов редкости.');let need=rule[0];for(const n of pool){const q=Math.min(need,this.count(n));this.remove(n,q);need-=q;if(!need)break;}const options=Object.values(D.items).filter(x=>x.rarity===rule[1]&&x.tier<=this.s.tier&&x.slot);this.need(options.length,'Нет подходящих предметов.');const chosen=options[Math.floor(this.rng()*options.length)].name;this.add(chosen);this.say('Обмен редкости: '+chosen);}
 questLock(q){const s=this.s;if(s.quests[q.id]?.done)return 'Завершено';if(s.level<q.level)return 'Уровень '+q.level;if(s.rep<q.rep)return 'Репутация '+q.rep;if(q.prerequisites.some(id=>!s.quests[id]?.done))return 'Завершите: '+q.prerequisites.join(', ');if(q.id==='4.5'&&total(s.kills)<100)return 'Победите 100 врагов';if(q.id==='2.4'&&(total(s.kills)<50||(s.hour>=6&&s.hour<20)))return '50 побед и ночное время';if(q.id==='1.2'&&s.choices['1.1']==='Солгать')return 'Корин не узнал правду. Ветка закрыта до NG+.';return '';}
 accept(id){this.idle();const q=D.quests.find(x=>x.id===id);this.need(q,'Нет задания.');this.need(this.s.tier===q.tier,'Поговорите с NPC на ярусе '+q.tier);this.need(!this.questLock(q),this.questLock(q));this.need(!this.s.quests[id],'Задание уже принято.');this.s.quests[id]={done:false,baseKills:{...this.s.kills},baseExplore:{...this.s.explored},baseCraft:this.s.crafts,basePick:this.s.pickkills};this.say('Задание принято: '+q.name);}
 progress(q){const s=this.s,active=s.quests[q.id];return q.goals.map(([t,n,target])=>{let value=0;if(t==='item')value=this.count(n);if(t==='kill')value=n==='*'?total(s.kills)-total(active?.baseKills||{}):(s.kills[n]||0)-(active?.baseKills?.[n]||0);if(t==='explore')value=(s.explored[n]||0)-(active?.baseExplore?.[n]||0);if(t==='craft')value=s.crafts-(active?.baseCraft||0);if(t==='pickkills')value=s.pickkills-(active?.basePick||0);if(t==='flawless')value=s.flawless;if(t==='completion')value=Object.entries(s.quests).filter(([id,v])=>v.done&&id!=='7.3').length;return {type:t,name:n,target,value:clamp(value,0,target),done:value>=target};});}
 complete(id,choice=''){this.idle();const s=this.s,q=D.quests.find(x=>x.id===id),a=s.quests[id];this.need(q&&a&&!a.done,'Задание недоступно.');this.need(s.tier===q.tier,'Вернитесь к NPC на ярусе '+q.tier);this.need(this.progress(q).every(g=>g.done),'Цели ещё не выполнены.');this.need(!q.choices.length||q.choices.includes(choice),'Выберите решение.');if(id==='3.2'&&choice==='Выкупить сестру')this.need(s.coins>=1000,'Для выкупа нужно 10 серебра.');for(const [t,n,c]of q.goals)if(t==='item')this.remove(n,c);a.done=true;s.choices[id]=choice;s.coins+=q.money;s.rep+=q.reputation;for(const[n,c]of Object.entries(q.rewards))this.add(n,c);this.xp(100*q.tier*q.tier);this.say('Завершено: '+q.name+(choice?' · '+choice:''));
 const grant=(n)=>this.add(n);switch(id){
 case '1.1':if(choice==='Солгать'){s.coins+=300;s.rep-=30;}break;
 case '1.2':if(choice==='Пощадить'){this.remove('Крысиный король (питомец)',1);grant('Крысиный амулет');}break;

 case '1.6':s.flags.craftBonus=(s.flags.craftBonus||0)+.05;break;
 case '1.9':s.flags.teacher=choice==='Спасти учителя';if(!s.flags.teacher)grant('Рецепт учителя');break;
 case '2.2':grant(choice==='Освободить брата'?'Амулет братства':'Кирка брата');s.flags.brother=choice==='Освободить брата';break;
 case '2.3':s.flags.borinDiscount=.5;break;
 case '2.4':grant(choice==='Принять сделку'?'Проклятый амулет':'Благословение');break;

 case '3.3':s.flags.moonSecret=true;break;

 case '4.2':if(choice==='Исцелить Тарна')s.flags.tarnDiscount=.3;else{s.flags.craftBonus=(s.flags.craftBonus||0)+.5;s.rep-=125;}break;
 case '4.4':s.flags.tarnDiscount=.5;break;
 case '4.5':if(choice==='Разорвать контракт')this.start(D.mobs.find(m=>m.name==='Вал’Гор').id);break;
 case '4.6':grant(choice==='Помочь Легиону'?'Адская броня':'Оружие против демонов');break;
 case '5.2':if(choice==='Освободить души')grant('Благословение');else this.add('Душа банши',5);break;
 case '5.4':grant(choice==='Освободить Мората'?'Полный сет «Морат»':'Морат-питомец');break;
 case '6.2':grant(choice==='Принять себя'?'Зеркальный двойник (питомец)':'Третий глаз');break;
 case '6.3':grant(choice==='Освободить Изнанку'?'Сет «Изнанка» (4 части)':'Око Бездны');break;
 case '6.5':if(choice==='Освободить Хрона'){this.add('Эликсир ускорения',3);s.flags.chronAlly=true;}else grant('Откат смерти');break;
 case '6.7':s.flags.secretEnding=choice;break;

 }this.achievements();}
 achievements(){const s=this.s,n=Object.values(s.quests).filter(x=>x.done).length;for(const [name,req,reward]of [['Помощник',10,100],['Герой города',25,500],['Легенда',41,10000]])if(n>=req&&!s.achievements[name]){s.achievements[name]=true;s.coins+=reward;this.say('Достижение: '+name);}if(['6.4','6.5','6.6','6.7'].every(id=>s.quests[id]?.done)&&!s.achievements['Хранитель времени']){s.achievements['Хранитель времени']=true;this.add('Часы Хрона');}if(['Полный сет «Морат»','Сет «Изнанка» (4 части)','Наследие Тар-Морана · выкованный'].every(n=>this.count(n))&&!s.achievements['Наследник']){s.achievements['Наследник']=true;this.add('Наследие Тар-Морана');}const evil={'1.1':'Солгать','1.9':'Убить учителя','2.2':'Убить брата','3.6':'Оставить призрака','4.2':'Усилить проклятие','4.6':'Помочь Легиону','5.4':'Подчинить Мората','6.3':'Подчинить Изнанку'};if(Object.entries(evil).every(([id,c])=>s.choices[id]===c)&&!s.achievements['Тёмный путь']){s.achievements['Тёмный путь']=true;this.add('Проклятый сет');}}
 ngPlus(keep=true){this.idle();this.need(this.s.ending,'Сначала завершите «Сердце Бездны».');if(!this.s.flags.ngReady)this.remove('Слеза Бездны',500);const old=this.s;this.create(old.name,old.cls);const s=this.s;s.ng=old.ng+1;if(keep){s.level=old.level;s.stats=old.stats;s.inventory=old.inventory;s.equipment=old.equipment;s.skills=old.skills;s.loadout=old.loadout;s.skillPoints=old.skillPoints;s.statPoints=old.statPoints;s.durability=old.durability;s.upgrades=old.upgrades;s.flags.memories=old.choices;}s.hp=this.stats().hp;s.mana=this.stats().mana;this.say('Новый цикл Бездны '+s.ng+'. Враги сильнее; история началась заново.');}

 static validate(v){if(!v||v.version!==2||!D.classes[v.cls]||typeof v.name!=='string'||v.name.length>24)throw Error('Это не сохранение Тар-Морана версии 2.');for(const k of ['level','xp','hp','mana','coins','rep','tier','day','hour','turns','curse','breath','statPoints','skillPoints','crafts','pickkills','flawless','trials','ng'])if(!Number.isFinite(v[k]))throw Error('Повреждено поле '+k);if(v.level<1||v.level>60||v.tier<1||v.tier>7||!D.zones[v.tier-1].rooms.includes(v.room))throw Error('Неверная локация или уровень.');for(const k of ['inventory','equipment','durability','upgrades','stats','skills','kills','explored','bosses','quests','choices','achievements','flags'])if(!v[k]||typeof v[k]!=='object'||Array.isArray(v[k]))throw Error('Повреждено '+k);for(const[n,q]of Object.entries(v.inventory))if(!D.items[n]||!Number.isInteger(q)||q<0)throw Error('Повреждён инвентарь.');for(const[k,n]of Object.entries(v.equipment))if(!slots.includes(k)||D.items[n]?.slot!==k||!v.inventory[n])throw Error('Неверная экипировка.');for(const k of ['strength','agility','intellect','vitality','luck'])if(!Number.isFinite(v.stats[k])||v.stats[k]<0)throw Error('Неверные характеристики.');if(!Array.isArray(v.loadout)||v.loadout.length>6||v.loadout.some(id=>!D.skills.some(a=>a.id===id&&a.cls===v.cls&&!a.passive)||!v.skills[id]))throw Error('Неверные умения.');if(!Array.isArray(v.feed)||v.feed.some(x=>typeof x!=='string'))throw Error('Неверный журнал.');if(v.battle){const b=v.battle;if(!D.mobs.some(m=>m.id===b.id)||!Number.isFinite(b.enemyHp)||!Number.isFinite(b.maxHp)||!Number.isFinite(b.attack)||!Number.isFinite(b.turn)||!Array.isArray(b.logs)||b.logs.some(x=>typeof x!=='string')||!b.cooldowns||!b.enemyEffects||!b.heroEffects)throw Error('Повреждено сохранение боя.');}return v;}

</script><script>(function(){'use strict';const D=TM_DATA,KEY='tar-moran-v2',PAGES={home:['⌂','Город'],map:['◇','Карта мира'],battle:['⚔','Сражение'],character:['♙','Персонаж'],inventory:['▣','Инвентарь'],guilds:['⚒','Мастерские'],quests:['☷','Задания'],codex:['✧','Кодекс']},OFFLINE=document.body.dataset.offline==='true';

function home(){if(!game.s)return `${title('ТЕКСТОВАЯ RPG · НОВАЯ ИСТОРИЯ','Врата Тар-Морана','Семь ярусов подземного города. Один путь к Сердцу Бездны.')}<section class="hero">${art}<div class="eyebrow">ХРОНИКИ ПОДЗЕМНОГО ГОРОДА</div><h1>Глубина помнит<br>каждого.</h1><p>Пройди от последнего рынка до Сердца Бездны. Побеждай вручную, создавай снаряжение и решай, кому доверять.</p><span class="tag">Одиночная игра · без энергии и автобоя</span></section><h2>Кем ты войдёшь в город?</h2><div class="grid">${Object.entries(D.classes).map(([id,c])=>`<button class="card class-card ${id===selectedClass?'selected':''}" data-action="class" data-arg="${id}" aria-pressed="${id===selectedClass}"><div class="class-symbol">${c.icon}</div><h3>${c.name}</h3><p>${c.description}</p><small>${c.hp} HP · ${c.mana} маны · 24 умения</small></button>`).join('')}</div><div class="card" style="margin-top:20px"><label for="hero-name">Имя героя</label><div class="row" style="margin-top:10px"><input id="hero-name" maxlength="24" value="Странник" autocomplete="off">${btn('Войти в Тар-Моран →','create','','btn-primary')}</div></div><div class="notice">Сохранение хранится в этом браузере. Предыдущая игра «Пепельные земли» остаётся в своём сохранении. Здесь начинается новая история.</div>`;
 const s=game.s,st=game.stats(),c=D.classes[s.cls];return `${title('ЯРУС '+s.tier+' / 7 · ДЕНЬ '+s.day+', '+String(s.hour).padStart(2,'0')+':00',esc(s.room),'Добро пожаловать, '+esc(s.name)+'. Следующий шаг ждёт на карте или в журнале заданий.',`<div class="row">${btn('Отдохнуть в городе','rest','','btn-quiet',!!lock())}</div>`)}<section class="hero">${art}<div class="eyebrow">${D.zones[s.tier-1].subtitle}</div><h1>${s.ending?'Судьба города<br>решена.':'Ниже света.<br>Ближе к истине.'}</h1><p>${D.zones[s.tier-1].description}</p><div class="row">${btn(lock()?'Продолжить бой →':'Открыть карту →','go',lock()?'battle':'map','btn-primary')}${btn('Журнал заданий','go','quests','btn-quiet')}</div></section><div class="split"><section class="card"><div class="row between"><h2>${c.icon} ${esc(s.name)}</h2><span class="tag">${c.name} · уровень ${s.level}</span></div>${bar('Здоровье',s.hp,st.hp)}${bar('Мана',s.mana,st.mana,'mana')}${bar('Опыт',s.xp,game.xpNeed(),'xp')}<div class="stats">${[['Атака',st.attack],['Броня',st.defense],['Репутация',s.rep],['Победы',Object.values(s.kills).reduce((a,b)=>a+b,0)]].map(([n,v])=>`<div class="stat-box"><strong>${v}</strong><small>${n}</small></div>`).join('')}</div>${btn('Настроить персонажа','go','character','','')}${s.statPoints||s.skillPoints?` <span class="tag">Есть свободные очки</span>`:''}</section><section class="card"><div class="eyebrow">ПОСЛЕДНИЕ СОБЫТИЯ</div><h2>Хроника странника</h2><div class="log">${s.feed.slice(0,7).map(t=>`<p>${esc(t)}</p>`).join('')}</div></section></div>${s.ending?ending():''}`;}
function mapSvg(){const s=game.s;return `<svg class="worldmap" viewBox="0 0 570 700" role="img" aria-label="Семь ярусов Тар-Морана, сверху вниз"><defs><pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#9eb8a2" stroke-opacity=".035"/></pattern></defs><rect width="570" height="700" fill="url(#grid)"/><path d="M30 55L90 130 42 220 120 300 38 460 90 550 22 665M540 38L470 145 535 240 454 360 540 475 465 584 540 684" stroke="#4c6253" stroke-opacity=".3" fill="none"/><path d="M225 88L330 170 220 257 320 345 220 433 320 522 246 621" stroke="#88744f" stroke-opacity=".7" stroke-width="2" stroke-dasharray="4 6" fill="none"/>${D.zones.map((z,i)=>{const x=[225,330,220,320,220,320,246][i],y=88+i*88,locked=game.gate(z.id);return `<g class="map-point" data-action="zone" data-arg="${z.id}" tabindex="0" role="button" aria-label="${z.name}${locked?', закрыто':''}" opacity="${locked?.45:1}"><circle cx="${x}" cy="${y}" r="${selectedTier===z.id?29:23}" fill="${selectedTier===z.id?'#534a35':'#1b292a'}" stroke="${s.tier===z.id?'#9cd6b3':'#927950'}"/><text x="${x}" y="${y+6}" text-anchor="middle" font-size="17" fill="#dcc79f">${z.id}</text><text x="${x+(i%2?-38:38)}" y="${y-5}" text-anchor="${i%2?'end':'start'}" fill="#ced5c7" font-size="12">${z.name}</text><text x="${x+(i%2?-38:38)}" y="${y+14}" text-anchor="${i%2?'end':'start'}" fill="#798d85" font-size="9">${locked?'ЗАКРЫТО':'УР. '+z.range}${s.tier===z.id?' · ВЫ ЗДЕСЬ':''}</text></g>`;}).join('')}<text x="35" y="668" fill="#687c73" font-size="9" letter-spacing="2">К СЕРДЦУ БЕЗДНЫ ↓</text></svg>`;}
function mobCard(m){const s=game.s,available=m.tier===s.tier&&!lock();return `<details><summary><span class="mobhead"><span class="enemy-icon">${esc(m.icon)}</span><span><strong>${esc(m.name)}</strong><small>${m.hp<0?'HP ×'+(-m.hp):m.hp+' HP'} · ${m.attack} урона ${m.boss?'· БОСС':''}</small></span></span><span class="accent">＋</span></summary><div><p>${esc(m.behavior)}</p>${m.drops.map(d=>`<div class="loot-line"><span>${itemName(d[0])} · ${d[2]===d[3]?d[2]:d[2]+'–'+d[3]} шт.</span><b>${game.chance(d)}%</b></div>`).join('')}<p style="font-size:10px;margin:14px 0">Каждый предмет разыгрывается независимо. Удача влияет только на легендарные выпадения.</p>${btn('Вступить в бой','fight',m.id,'btn-primary',!available)}</div></details>`;}
function mapPage(){const s=game.s,z=D.zones[selectedTier-1],gate=game.gate(z.id);return `${title('АТЛАС ПОДЗЕМНОГО ГОРОДА','Семь ярусов Тар-Морана','Выберите ярус на карте. Откройте карточку врага, чтобы увидеть добычу и её вероятность.')}<div class="split"><div><div class="map-wrap"><div class="map-note">ТАР-МОРАН / КАРТА ГЛУБИН</div>${mapSvg()}</div><div class="notice">${game.gate(Math.min(s.tier+1,7))||'Следующий путь открыт.'}</div></div><div><div class="card"><div class="eyebrow">ЯРУС 0${z.id} · РЕКОМЕНДУЕМЫЙ УРОВЕНЬ ${z.range}</div><h2>${z.name}</h2><p>${z.description}</p>${gate?`<div class="notice">🔒 ${gate}</div>`:''}<div class="rooms">${z.rooms.map(r=>btn(esc(r),'travel',z.id+'|'+r,s.room===r?'current':'',!!gate||!!lock())).join('')}</div>${s.tier===z.id?`<div class="row">${btn('Обыскать: '+esc(s.room),'explore','','btn-primary',!!lock())}${btn('Подождать час','wait','','',!!lock())}</div><p style="margin:10px 0 0;font-size:11px">Обыск даёт материалы, но может привлечь врага.</p>${s.tier===5?bar('Проклятие',s.curse,100,'danger'):''}${s.tier===3?`<small>Дыхание: ${game.stats().breath?'бесконечное':game.count('Дыхание бездны')?'постоянный доступ':s.breath+' ходов'}</small>`:''}`:''}</div>${z.id===4&&s.tier===4?`<div class="card" style="margin-top:14px"><h3>Руны Горна</h3><p>«Сначала родился огонь, затем ударил молот, и печать завершила труд».</p><div class="row">${['Молот','Печать','Огонь'].map(r=>btn(r,'rune',r,'',!!lock()||s.flags.forgeOpen)).join('')}</div><small>${s.flags.forgeOpen?'Горн открыт.':'Активировано рун: '+(s.flags.runeStep||0)+' / 3'}</small></div>`:''}${z.id===7&&s.tier===7?`<div class="card" style="margin-top:14px"><h3>Коридор Испытаний</h3><p>Три стража перед финальной ареной. Пройдено: ${s.trials}/3.</p>${btn('Следующее испытание','trial','','btn-primary',!!lock()||s.trials>=3)}</div>`:''}<h3 style="margin:24px 0 12px">Обитатели яруса</h3>${D.mobs.filter(m=>m.tier===z.id).map(mobCard).join('')}</div></div>`;}
function battlePage(){const s=game.s,b=s.battle;if(!b)return title('РУЧНОЙ БОЙ','Сейчас спокойно','Выберите противника на карте.')+btn('Открыть карту','go','map','btn-primary');const m=D.mobs.find(x=>x.id===b.id),st=game.stats(),c=D.classes[s.cls];return `${title('ЯРУС '+s.tier+' · ХОД '+b.turn,'Сражение',m.name+(b.trial?' · Испытание '+(s.trials+1):''))}<div class="split"><div class="card"><div class="fight"><div><div class="portrait"><span>${s.flags.appearance===1?'◈':s.flags.appearance===2?'✦':c.icon}</span></div><h3>${esc(s.name)}</h3>${bar('Здоровье',s.hp,st.hp)}${bar('Мана',s.mana,st.mana,'mana')}<small>Атака ${st.attack} · броня ${st.defense}</small></div><div class="accent">×</div><div><div class="portrait enemy"><span>${esc(m.icon)}</span></div><h3>${esc(m.name)}</h3>${bar('Здоровье',b.enemyHp,b.maxHp,'danger')}<small>Атака ${b.attack}${m.boss?' · Фаза '+(1+Math.min((m.name==='Истинная форма Бездны'?4:3)-1,Math.floor((1-b.enemyHp/b.maxHp)*(m.name==='Истинная форма Бездны'?4:3)))):''}</small></div></div><div class="row between"><div class="pill-list">${Object.entries(b.heroEffects).map(([k,v])=>`<span class="effect negative">${effectName(k)} · ${v.turns}</span>`).join('')}${b.shield?`<span class="effect">Барьер: ${b.shield}</span>`:''}</div><div class="pill-list">${Object.entries(b.enemyEffects).map(([k,v])=>`<span class="effect">${effectName(k)} · ${v.turns}</span>`).join('')}</div></div>${b.result?`<div class="notice"><h2>${b.result==='win'?'Победа':b.result==='loss'?'Поражение':'Отступление'}</h2>${b.result==='win'?`<p>+${b.xp} опыта · добыча уже в инвентаре</p>${b.loot.map(([n,q])=>`<div>${itemName(n)} ×${q}</div>`).join('')}`:'<p>Отдохните в городе, прежде чем продолжить путь.</p>'}</div><div class="row">${btn('На карту','go','map','btn-primary')}${btn('Отдых в городе','rest')}${b.result==='win'&&!b.trial?btn('Сразиться снова','fight',m.id):''}</div>`:`<div class="intent">Намерение противника: ${esc(game.intent())}</div><div class="fight-controls">${btn('⚔ Обычная атака<small>+4 маны</small>','act','attack','btn-primary')}${btn('◈ Защита<small>−65% входящего урона · +10 маны</small>','act','guard')}${btn('Отступление<small>65% успеха · потеря 2% монет</small>','act','flee')}${s.loadout.map(id=>{const a=D.skills.find(x=>x.id===id);return btn(esc(a.name)+`<small>${a.mana} маны · ${b.cooldowns[id]>0?'ожидание '+b.cooldowns[id]+' ход.':'готово'}</small>`,'act','skill:'+id,'',(b.cooldowns[id]||0)>0||s.mana<a.mana);}).join('')}${st.water?btn('Водяной взрыв<small>Тризуб · 10 маны</small>','act','water','',!!b.cooldowns.water||s.mana<10):''}${st.mirror?btn('Зеркальный дар<small>Копировать силу врага</small>','act','mirror','',!!b.cooldowns.mirror):''}${st.time?btn('Песочные часы<small>Остановить врага</small>','act','relic','',!!b.cooldowns.relic):''}</div><hr class="rule"><div class="row"><select id="battle-item" aria-label="Расходуемый предмет">${Object.keys(s.inventory).filter(n=>s.inventory[n]&&D.items[n].effect).map(n=>`<option value="${esc(n)}">${esc(n)} ×${s.inventory[n]}</option>`).join('')}</select>${btn('Использовать · 1 ход','battleitem')}</div>`}</div><div><section class="card"><div class="eyebrow">ЖУРНАЛ СРАЖЕНИЯ</div><h2>Каждый ход важен</h2><div class="log" aria-live="polite">${b.logs.map(t=>`<p>${esc(t)}</p>`).join('')}</div></section><div class="notice">Атака, защита, умение и зелье расходуют ход. Умения восстанавливаются только во время боя. Автобоя нет.</div></div></div>`;}
function effectName(k){return {stun:'Оглушение',slow:'Замедление',poison:'Яд',burn:'Огонь',power:'Усиление',counter:'Ответный удар',vampire:'Вампиризм',resist:'Сопротивление',fireguard:'Огнестойкость',summon:'Скелет',invisible:'Невидимость'}[k]||k;}
function character(){const s=game.s,st=game.stats(),names={strength:'Сила',agility:'Ловкость',intellect:'Интеллект',vitality:'Выносливость',luck:'Удача'};return `${title('ПЕРСОНАЖ · '+D.classes[s.cls].name.toUpperCase(),esc(s.name),'Развивайте характеристики, изучайте таланты и готовьте до шести активных умений.')}<div class="split"><section class="card"><h2>Характеристики</h2><p>Свободно очков: <b class="accent">${s.statPoints}</b></p>${Object.entries(names).map(([k,n])=>`<div class="loot-line"><span>${n}</span><span>${s.stats[k]} ${btn('+','stat',k,'small',!s.statPoints||!!lock())}</span></div>`).join('')}<div class="notice">Главный параметр: ${names[D.classes[s.cls].primary]}. Даёт +2 атаки за очко. Выносливость: +12 HP. Интеллект: +3 маны. Удача: +0,5 процентного пункта к легендарному дропу.</div><div class="stats">${['attack','defense','crit','dodge'].map(k=>`<div class="stat-box"><strong>${st[k]<1?Math.round(st[k]*100)+'%':st[k]}</strong><small>${labels[k]}</small></div>`).join('')}</div></section><section class="card"><h2>Сохранение</h2><p>Прогресс сохраняется после каждого действия. Скачайте копию, чтобы перенести героя в другой браузер.</p><div class="row">${btn('Скачать сохранение','export','','btn-primary')}${btn('Загрузить сохранение','import','','',!!lock())}</div><input id="save-file" type="file" accept="application/json,.json" hidden><hr class="rule"><h3>Достижения</h3><div class="pill-list">${Object.keys(s.achievements).map(n=>`<span class="tag">${esc(n)}</span>`).join('')||'<small>Первое достижение — за 10 завершённых заданий.</small>'}</div><hr class="rule"><small>Одиночная локальная версия. Сетевые группы, PvP и общий чат отсутствуют.</small>${s.ending?`<hr class="rule">${btn('Новый цикл NG+','ng','','btn-quiet',!!lock())}`:''}</section></div><div class="page-title" style="margin-top:32px"><h2>Умения и таланты</h2><span class="tag">Очки навыков: ${s.skillPoints} · Подготовлено ${s.loadout.length}/6</span></div><div class="grid">${D.skills.filter(a=>a.cls===s.cls).map(a=>`<article class="card"><div class="row between"><span class="tag">${a.passive?'ТАЛАНТ':'УМЕНИЕ'} · УР. ${a.level}</span><small>${s.skills[a.id]||0}/3</small></div><h3 style="margin-top:14px">${esc(a.name)}</h3><p>${esc(a.description)}</p>${a.passive?`<p class="accent">${labels[a.effect]} +${a.amount<1?Math.round(a.amount*100)+'%':a.amount}</p>`:`<p class="accent">${a.mana} маны · восстановление ${a.cooldown} ход.</p>`}<div class="row">${btn('Изучить +1','learn',a.id,'small',(s.skills[a.id]||0)>=3||s.level<a.level||!s.skillPoints||!!lock())}${!a.passive&&s.skills[a.id]?btn(s.loadout.includes(a.id)?'✓ Подготовлено':'Подготовить','toggle',a.id,'small',!!lock()):''}</div></article>`).join('')}</div>`;}
function inventory(){const s=game.s,slotNames={weapon:'ОРУЖИЕ',armor:'БРОНЯ',head:'ГОЛОВА',relic:'РЕЛИКВИЯ',boots:'ОБУВЬ',pet:'ПИТОМЕЦ'},list=Object.keys(s.inventory).filter(n=>s.inventory[n]>0&&n.toLowerCase().includes(inventoryFilter.toLowerCase())).sort((a,b)=>D.items[b].rarity-D.items[a].rarity);return `${title('СНАРЯЖЕНИЕ И НАХОДКИ','Инвентарь','Предметы, ключи и материалы хранятся вместе. Цвет обозначает редкость.')}<div class="grid">${Object.entries(slotNames).map(([k,n])=>`<div class="slot"><b>${n}</b>${s.equipment[k]?`${itemName(s.equipment[k])}<small style="display:block">${bonus(s.equipment[k])}</small>${btn('Снять','unequip',k,'small',!!lock())}`:'<span class="muted">Пусто</span>'}</div>`).join('')}</div><div class="toolbar" style="margin-top:25px"><input id="inventory-search" value="${esc(inventoryFilter)}" placeholder="Найти предмет…" aria-label="Найти предмет"><span class="tag">Монеты: ${money(s.coins)}</span></div><div class="list">${list.map(n=>{const it=D.items[n],equipped=Object.values(s.equipment).includes(n);return `<article class="card item"><div><h3>${itemName(n)} <small style="display:inline">×${s.inventory[n]}</small></h3><small>${bonus(n)|| (it.effect?'Расходуемый предмет':'Материал / предмет истории')}</small>${it.slot?`<small>Прочность: ${Math.round(s.durability[n]??100)}% ${s.upgrades[n]?'· улучшение +'+s.upgrades[n]:''}</small>`:''}</div><div class="row">${it.slot?btn(equipped?'✓ Надето':'Надеть','equip',n,'small',equipped||!!lock()):''}${it.effect?btn('Использовать','use',n,'small',!!lock()):''}${btn('Продать · '+money(Math.max(1,Math.floor(game.price(n)*.4))),'sell',n,'small',equipped||!!lock())}</div></article>`;}).join('')||'<div class="empty">Предметы не найдены.</div>'}</div>`;}
function guilds(){const s=game.s;return `${title('ЯРУС '+s.tier+' · РЕМЁСЛА И ОБМЕН','Мастерские и торговцы','Рецепты и торговцы зависят от текущего яруса. Репутация снижает цены за монеты.',`<span class="tag">${money(s.coins)} · скидка ${Math.round(game.discount()*100)}%</span>`)}<div class="toolbar">${D.zones.map(z=>btn(z.id+'. '+z.name,'travel',z.id+'|'+z.rooms[0],'small',!!game.gate(z.id)||!!lock())).join('')}</div><h2>Торговцы</h2><div class="grid two">${D.shops.filter(sh=>(sh.tier===s.tier||sh.rule==='fox'&&s.flags.foxTier===s.tier)&&(!['teacher','brother','sister','fox'].includes(sh.rule)||!game.shopOpen(sh))).map(sh=>`<section class="card"><div class="eyebrow">${sh.room}</div><h3>${sh.name}</h3><p>Валюта: ${sh.currency==='coins'?'монеты':sh.currency==='legendary'?'ненадетые легендарные предметы':sh.currency}</p>${game.shopOpen(sh)?`<div class="notice">${game.shopOpen(sh)} ${btn('Подождать час','wait','','small',!!lock())}</div>`:''}${sh.goods.map(([n,p,rep],i)=>`<div class="loot-line"><span>${itemName(n)}${rep?`<small style="display:block">Репутация ${rep}</small>`:''}</span>${btn(sh.id==='librarian'&&s.flags.freeScrolls&&n.startsWith('Свиток')?'Бесплатно':sh.currency==='coins'?money(Math.ceil(p*(1-Math.max(game.discount(),s.flags[sh.id+'Discount']||0)))):p+' шт.','buy',sh.id+'|'+i,'small',!!lock()||s.rep<rep||!!game.shopOpen(sh))}</div>`).join('')}</section>`).join('')}</div>${services()}<h2 style="margin-top:30px">Крафт · ярус ${s.tier}</h2><div class="grid">${D.recipes.filter(r=>r.tier===s.tier).map(r=>{const enough=Object.entries(r.cost).every(([n,q])=>game.count(n)>=q);return `<article class="card"><div class="eyebrow">${D.items[r.output].slot==='pet'?'ПИТОМЕЦ':'РЕЦЕПТ'} · ×${r.qty}</div><h3>${esc(r.name)}</h3><p>${esc(r.description)}</p>${Object.entries(r.cost).map(([n,q])=>`<div class="loot-line"><span>${itemName(n)}</span><b class="${game.count(n)>=q?'good':'bad'}">${game.count(n)}/${q}</b></div>`).join('')}<div style="margin-top:15px">${btn('Создать','craft',r.id,'btn-primary',!enough||!!lock())}</div></article>`;}).join('')}</div>${[1,4,7].includes(s.tier)?`<div class="card" style="margin-top:24px"><h2>Обслуживание снаряжения</h2><p>Ремонт восстанавливает прочность. Улучшение даёт +4 атаки оружию или +4 брони доспеху за ступень.</p>${Object.values(s.equipment).filter(n=>D.items[n].slot!=='pet').map(n=>`<div class="loot-line"><span>${itemName(n)} · ${Math.round(s.durability[n]??100)}%</span><div class="row">${btn('Починить · '+money(Math.max(1,Math.ceil(game.price(n)*.1*(1-game.discount())))),'repair',n,'small',!!lock()||s.tier===7)}${['weapon','armor'].includes(D.items[n].slot)?btn('Улучшить +'+((s.upgrades[n]||0)+1),'upgrade',n,'small',!!lock()):''}</div></div>`).join('')}</div>`:''}<div class="card" style="margin-top:24px"><h3>Обмен редкости</h3><p>Обмен расходует ненадетые предметы указанной редкости; результат выбирается случайно. Сначала наденьте вещи, которые хотите сохранить.</p><div class="row">${[[0,'100 обычных → 1 редкий',5],[1,'10 необычных → 1 редкий',4],[2,'5 редких → 1 эпический',3],[3,'3 эпических → 1 легендарный',6]].map(([r,n,t])=>btn(n,'convert',r,'small',s.tier<t||!!lock())).join('')}</div></div>`;}
function services(){const s=game.s;return `<div class="card" style="margin-top:24px"><h3>Особые услуги</h3><div class="row">${s.tier===2?btn('5 хвостов → зелье HP','service','tail','small',!!lock()):''}${s.tier===5?btn('20 костей → очищение','service','bone','small',!!lock()):''}${s.tier===6?`${btn('Сменить облик · 20 осколков зеркала','service','appearance','small',!!lock())}<select id="service-item" aria-label="Предмет для копирования">${Object.keys(s.inventory).filter(n=>s.inventory[n]&&D.items[n].slot).map(n=>`<option value="${esc(n)}">${esc(n)}</option>`).join('')}</select>${btn('Копировать · 100 осколков','serviceitem','copy','small',!!lock())}`:''}${s.tier===7?`${btn('Сбросить умения · 20 слёз','service','respec','small',!!lock())}<select id="service-item" aria-label="Предмет для улучшения">${Object.keys(s.inventory).filter(n=>s.inventory[n]&&['weapon','armor'].includes(D.items[n].slot)).map(n=>`<option value="${esc(n)}">${esc(n)}</option>`).join('')}</select>${btn('Улучшить до +10 · 100 слёз','serviceitem','upgrade10','small',!!lock())}${btn('NG+ · 500 слёз','ng','','small',!!lock()||!s.ending)}`:''}${[1,3,4].includes(s.tier)?'<small>Торговля, рецепты и обслуживание доступны ниже. Новые особые услуги открываются на следующих ярусах.</small>':''}</div></div>`;}
function questsPage(){const s=game.s,shown=D.quests.filter(q=>questFilter==='all'||(questFilter==='active'?s.quests[q.id]&&!s.quests[q.id].done:questFilter==='done'?s.quests[q.id]?.done:q.tier===s.tier));return `${title('ЗАПИСИ СТРАННИКА','Журнал заданий','41 история Тар-Морана. Возьмите задание до охоты: новые победы и обыски засчитываются после принятия.')}<div class="toolbar">${[['current','Этот ярус'],['active','Активные'],['done','Завершённые'],['all','Все 41']].map(([id,n])=>btn(n,'questfilter',id,questFilter===id?'btn-primary':'')).join('')}<span class="tag">Завершено ${Object.values(s.quests).filter(x=>x.done).length}/41</span></div>${shown.map(q=>{const a=s.quests[q.id],lockReason=game.questLock(q),goals=game.progress(q),ready=a&&!a.done&&goals.every(x=>x.done);return `<article class="card quest-card"><div class="row between"><div class="eyebrow">${q.kind} ${q.id} · ЯРУС ${q.tier} · УР. ${q.level}</div><span class="tag">${a?.done?'ЗАВЕРШЕНО':a?'В РАБОТЕ':'НЕ ПРИНЯТО'}</span></div><h2>${q.name}</h2><div class="goals">${goals.map(g=>`<div class="goal"><span class="${g.done?'good':''}">${g.done?'✓':'○'} ${g.type==='kill'?'Победить: ':g.type==='item'?'Принести: ':g.type==='explore'?'Обыскать: ':''}${g.name==='*'?'любых врагов':esc(g.name)}</span><span>${g.value}/${g.target}</span></div>`).join('')}</div><p>Награда: ${q.money?money(q.money)+' · ':''}+${q.reputation} репутации${Object.keys(q.rewards).length?' · '+Object.entries(q.rewards).map(([n,c])=>esc(n)+' ×'+c).join(', '):''}. Выбор может изменить награду.</p>${a?.done?`<p class="good">${esc(s.choices[q.id]||'История завершена.')}</p>`:a?`<div class="row">${q.choices.length?q.choices.map(c=>btn(esc(c),'complete',q.id+'|'+c,'quest-choice',!ready||s.tier!==q.tier||!!lock())).join(''):btn('Сдать задание','complete',q.id,'btn-primary',!ready||s.tier!==q.tier||!!lock())}</div>${ready&&s.tier!==q.tier?`<small>Вернитесь на ярус ${q.tier}, чтобы сдать задание.</small>`:''}`:`${btn('Принять задание','accept',q.id,'btn-primary',!!lockReason||s.tier!==q.tier||!!lock())} <small>${lockReason|| (s.tier!==q.tier?'NPC находится на ярусе '+q.tier:'')}</small>`}<details><summary>Описание из вашего PDF <span>＋</span></summary><div class="source">${esc(q.source)}</div></details></article>`;}).join('')||'<div class="empty">Здесь пока нет заданий.</div>'}`;}
function ending(){const s=game.s,ends={'Уничтожить':'Ты разрываешь связь с Бездной. Древние механизмы умолкают, и впервые за века Верхний город встречает рассвет.','Подчинить':'Ты занимаешь пустой трон. Город подчиняется твоей воле, но каждый приказ отзывается ударом чужого сердца.','Слиться':'Ты становишься памятью Тар-Морана. Его улицы, жители и тени звучат в тебе одним бесконечным голосом.'};return `<section class="ending" style="margin-top:28px"><div class="eyebrow">ФИНАЛ · ${esc(s.ending)}</div><h1>Наследие Тар-Морана</h1><p>${ends[s.ending]||''}</p>${s.flags.secretEnding?`<p class="accent">Тайна времени: ${esc(s.flags.secretEnding)}</p>`:''}<p class="muted">Хроника хранит ${Object.keys(s.choices).length} ваших решений.</p>${btn('Продолжить исследование','go','map','btn-primary')} ${btn('Начать NG+','ng')}</section>`;}
function codex(){const query=codexFilter.toLowerCase(),matches=D.mobs.filter(m=>m.name.toLowerCase().includes(query));return `${title('СПРАВОЧНИК И ПРАВИЛА','Кодекс Тар-Морана','Мир создан по вашему PDF. Боевые формулы, темп и умения этой версии — самостоятельная адаптация.')}<div class="grid two"><section class="card"><h3>Как играть</h3><p>1. Возьмите у Корина «Пропавший торговец».<br>2. В Подвалах нажмите «Обыскать», победите трёх крыс.<br>3. Вернитесь на первый ярус и сдайте задание.<br>4. Развивайте героя, победите Каменного Стража и спускайтесь дальше.</p><p>Обычная атака восстанавливает ману. Защита особенно полезна перед мощным ударом. Противоядие снимает яд. Изученные умения нужно подготовить на странице персонажа.</p></section><section class="card"><h3>Правила этой версии</h3><p>Ручные текстовые бои, независимые броски добычи, 24 умения на класс, шесть активных слотов, экипировка и питомец. Энергии и автобоя нет.</p><p>Секунды эффектов из PDF переведены в ходы; платформинг, стелс и диалоги — в переходы, обыски и цели квестов. Испытание 10 минут без урона заменено 10 чистыми победами.</p><p>Это одиночная адаптация. Сетевые рейды, PvP, чат и точные скрытые формулы Pocket Combats здесь не воспроизведены.</p></section></div><details><summary>Уточнения и отличия от PDF</summary><div class="source">В PDF есть расхождения между сводными числами и подробными таблицами. В игре 18 обычных врагов и 11 боссов/особых противников: добавлены Крысиный Король, Левиафан и Вал’Гор, упомянутые вне таблиц.
Рецепты и базовые вероятности добычи перенесены из таблиц. Сила героев, опыт, дополнительная медь, параметры дополнительных боссов, длительность эффектов и таблицы обыска настроены для этой версии.
Квестовые последовательности сведены к проверяемым целям: обыск, победа, доставка, крафт и решение. Предметы-доказательства в отдельных заданиях представлены счётчиками побед. Добычу для задания нужно принести в сумке; она расходуется при сдаче.
Снаряжение может выпадать с врагов согласно PDF. Станции крафта доступны в пределах яруса. Мастерства гильдий, динамических NPC-диалогов и случайной генерации туннелей нет.
Вместо реального ожидания торговцы используют игровые дни и часы: одно действие = один час. Свиток дыхания действует 20 действий. Постоянный дар Дыхания бездны открывает подводные пещеры.
Улучшенные предметы с тем же названием отделены пометкой «выкованный». «Поношенный доспех» в рецепте сапог нормализован как «Кожаный доспех». Специальные валюты добываются обысками. Ремонт восстанавливает прочность без снижения её максимума.
Лис появляется после случайного обыска, 30% его товаров — подделки. Старый Маг приходит раз в 7 игровых дней. Спасённые учитель, брат и сестра открывают дополнительные магазины. Хранитель копирует вещи и меняет облик; Аватар сбрасывает умения и улучшает снаряжение до +10. NG+ стоит 500 слёз после финального задания или доступен бесплатно после 7.3; задание 7.3 требует остальные 40 заданий, без проверки коллекции всех легендарных предметов.
Некоторые описательные эффекты предметов (копирование любой способности без ограничений, отдельные стихии полного Наследия, лимит вместимости рюкзака) не реализованы; действующие бонусы показаны в инвентаре.
Описание Pocket Combats RPG: https://www.rustore.ru/catalog/app/com.pocketcombats (проверено 09.10.2026). Это ориентир для формата игры, а не спецификация её скрытых формул.</div></details><details><summary>Полный исходный документ · текст</summary><div class="source">${esc(D.source)}</div></details><div class="toolbar" style="margin-top:24px"><input id="codex-search" value="${esc(codexFilter)}" placeholder="Найти противника…" aria-label="Поиск по бестиарию"></div><h2>Бестиарий · ${matches.length}</h2>${matches.map(mobCard).join('')}`;}
function render(){page=currentPage();if(!PAGES[page])page='home';if(!game.s)page='home';const s=game.s;document.title='Тар-Моран · '+PAGES[page][1];$('nav').innerHTML='<div class="nav-label">ХРОНИКА ГЛУБИН</div>'+Object.entries(PAGES).map(([id,[icon,n]])=>`<a href="${OFFLINE?'#'+id:(id==='home'?'index':id)+'.html'}" class="${page===id?'active':''}" ${page===id?'aria-current="page"':''}><span>${icon}</span>${n}</a>`).join('')+'<div class="nav-foot">ТАР-МОРАН<br>Одиночная RPG<br><br>Семь ярусов.<br>Три пути к финалу.</div>';
 $('#top-status').innerHTML=s?`<span>${D.classes[s.cls].icon} ${esc(s.name)} <b class="accent">${s.level}</b></span><span class="desktop">${money(s.coins)}</span><span class="chip">${lock()?'ИДЁТ БОЙ':'ПРОГРЕСС СОХРАНЯЕТСЯ'}</span>`:'<span class="chip">НОВОЕ ПУТЕШЕСТВИЕ</span>';
 const views={home,map:mapPage,battle:battlePage,character,inventory,guilds,quests:questsPage,codex};$('#content').innerHTML=views[page]()+`<footer>Тар-Моран · самостоятельная адаптация по вашему документу · версия 2.0</footer>`;bind();}
function bind(){const f=$('#save-file');if(f)f.onchange=async()=>{try{const file=f.files[0];if(!file)return;if(file.size>2000000)throw Error('Файл слишком большой.');const next=TM_Game.validate(JSON.parse(await file.text()));if(!confirm('Заменить текущего героя сохранением «'+next.name+'»?'))return;game.s=next;game.cap();save();render();toast('Сохранение загружено.');}catch(e){toast(e.message,true);}};
 for(const [selector,key] of [['#inventory-search','inventory'],['#codex-search','codex']]){const el=$(selector);if(el)el.oninput=()=>{const start=el.selectionStart;if(key==='inventory')inventoryFilter=el.value;else codexFilter=el.value;render();$(selector).focus();$(selector).setSelectionRange(start,start);};}}
function download(text,name){const url=URL.createObjectURL(new Blob([text],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el||el.disabled)return;const action=el.dataset.action,arg=el.dataset.arg||'';try{if(action==='go'){go(arg);return;}if(action==='class'){selectedClass=arg;render();return;}if(action==='zone'){selectedTier=Number(arg);render();return;}if(action==='questfilter'){questFilter=arg;render();return;}if(action==='import'){$('#save-file').click();return;}if(action==='export'){download(game.export(),'tar-moran-save.json');return;}
 const s=game.s;switch(action){case 'create':game.create($('#hero-name').value,selectedClass);selectedTier=1;break;case 'rest':game.rest();break;case 'travel':{const[t,r]=arg.split('|');game.travel(Number(t),r);selectedTier=Number(t);break;}case 'explore':game.explore();break;case 'wait':game.wait();break;case 'service':game.service(arg);break;case 'serviceitem':game.service(arg,$('#service-item').value);break;case 'rune':game.solve(arg);break;case 'fight':game.start(arg);break;case 'trial':game.startTrial();break;case 'act':game.act(arg);break;case 'battleitem':game.act('item:'+($('#battle-item')?.value||''));break;case 'stat':game.allocate(arg);break;case 'learn':game.learn(arg);break;case 'toggle':game.toggle(arg);break;case 'equip':game.equip(arg);break;case 'unequip':game.idle();delete s.equipment[arg];game.cap();break;case 'use':game.use(arg);break;case 'sell':game.sell(arg);break;case 'craft':game.craft(arg);break;case 'repair':game.repair(arg);break;case 'upgrade':{const u=s.upgrades[arg]||0,cost=[1000,3000,10000,50000,150000,180000,220000,260000,300000,350000][u];if(!confirm('Улучшить «'+arg+'» за '+money(cost||0)+'?'))return;game.upgrade(arg);break;}case 'buy':{const[id,index]=arg.split('|');game.buy(id,Number(index));break;}case 'convert':if(!confirm('Потратить ненадетые предметы этой редкости на случайный обмен?'))return;game.convert(Number(arg));break;case 'accept':game.accept(arg);break;case 'complete':{const[id,c]=arg.split('|');if(c&&!confirm('Решение «'+c+'» будет сохранено в истории. Продолжить?'))return;game.complete(id,c);break;}case 'ng':if(!confirm('Начать новый цикл за 500 слёз Бездны (бесплатно после 7.3)? Текущие задания и карта сбросятся. Снаряжение и развитие сохранятся. Рекомендуется сначала скачать сохранение.'))return;game.ngPlus(true);selectedTier=1;break;}
 save();if(['fight','trial'].includes(action)||(game.s.battle&&!game.s.battle.result&&page!=='battle')){go('battle');return;}render();if(!['act','battleitem'].includes(action))toast(game.s.feed[0]||'Готово.');
 }catch(err){toast(err.message,true);}});
document.addEventListener('keydown',e=>{const el=e.target.closest?.('[data-action]');if(el?.tagName.toLowerCase()==='g'&&['Enter',' '].includes(e.key)){e.preventDefault();el.dispatchEvent(new MouseEvent('click',{bubbles:true}));}});
window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0);});window.addEventListener('storage',e=>{if(e.key===KEY&&e.newValue){try{game.s=TM_Game.validate(JSON.parse(e.newValue));render();toast('Сохранение обновлено в другой вкладке.');}catch{}}});if(game.s)selectedTier=game.s.tier;render();if(storageWarn)toast('Сохранение недоступно. Можно загрузить резервную копию на странице персонажа.',true);
})();
</script></body></html>
